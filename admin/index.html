<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog Admin — Kartik</title><link rel="stylesheet" href="admin.css"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head><body>
<div id="login-view" class="admin-login admin-card"><h1>Blog Admin</h1><p class="admin-help">Sign in with the username and password configured in <code>.env</code>.</p><form id="login-form"><label class="admin-label">Username</label><input id="login-user" class="admin-input" required><label class="admin-label">Password</label><input id="login-pass" type="password" class="admin-input" required><button class="admin-btn admin-btn-primary" type="submit">Login</button><div id="login-status" class="admin-status"></div></form></div>
<div id="app-view" class="admin-shell hidden"><nav class="admin-nav"><div class="admin-brand">./kartik · Blog Admin</div><div class="admin-nav-actions"><a class="admin-btn admin-btn-dark" href="../blog-post.html">View Blog</a><button id="logout-btn" class="admin-btn admin-btn-dark">Logout</button></div></nav><main class="admin-container"><div class="admin-grid"><section class="admin-card"><h1 id="form-heading">Create Post</h1><form id="post-form"><input type="hidden" id="post-id"><div class="admin-row"><div><label class="admin-label">Title *</label><input id="title" class="admin-input" required></div><div><label class="admin-label">Slug</label><input id="slug" class="admin-input" placeholder="auto-generated-from-title"></div></div><div class="admin-row"><div><label class="admin-label">Date</label><input id="date" type="date" class="admin-input"></div><div><label class="admin-label">Read time (minutes)</label><input id="read-time" type="number" min="1" value="5" class="admin-input"></div></div><label class="admin-label">Excerpt</label><textarea id="excerpt" class="admin-textarea" style="min-height:110px;font-family:inherit"></textarea><label class="admin-label">Image URL</label><input id="image" class="admin-input"><div class="admin-row"><div><label class="admin-label">Tags (comma separated)</label><input id="tags" class="admin-input" placeholder="Java, Spring Boot"></div><div><label class="admin-label">Author</label><input id="author" class="admin-input" value="Kartik Yadav Gurve"></div></div><div class="admin-row"><label><input id="featured" type="checkbox"> Featured</label><label><input id="published" type="checkbox"> Publish immediately</label></div><label class="admin-label">Content HTML *</label><textarea id="content" class="admin-textarea" required placeholder="<h2>Introduction</h2><p>Write your article...</p>"></textarea><div class="admin-actions"><button class="admin-btn admin-btn-primary" type="submit" id="save-btn">Create Post</button><button class="admin-btn admin-btn-secondary" type="button" id="reset-btn">Clear</button></div><div id="form-status" class="admin-status"></div></form></section>
<section class="admin-card"><h2>Posts</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Post</th><th>Status</th><th>Actions</th></tr></thead><tbody id="posts-body"></tbody></table></div></section></div></main></div><script src="admin.js"></script></body></html>
